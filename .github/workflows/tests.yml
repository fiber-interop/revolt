name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          tools: composer
          coverage: none

      - name: Install
        run: composer update --no-interaction --no-progress

      # ConformanceTest runs the api's examples/ against this adapter (fiber-interop-conformance).
      - name: Tests
        run: vendor/bin/phpunit
